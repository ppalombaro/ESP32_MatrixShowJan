; PlatformIO Project Configuration File
; V16.4.13-2026-09-07 - pinned platform, dropped NTPClient (SNTP via configTzTime)

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_port = COM3

; Upload Settings
upload_port = COM3
upload_speed = 921600

; Partition Table (CRITICAL - Must match your custom partitions.csv)
board_build.partitions = partitions.csv

; Build Flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Library Dependencies
lib_deps =
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^6.21.3

; Extra Scripts (for custom build steps if needed)
; extra_scripts = pre:custom_build.py
